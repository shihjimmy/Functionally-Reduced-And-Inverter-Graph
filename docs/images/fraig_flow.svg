<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" font-family="Noto Sans CJK TC, Noto Sans, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="700" height="510" fill="#ffffff"/>
<rect x="200" y="20" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="350.0" y="39.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">依 DFS 順序取下一個閘 g</text><text x="350.0" y="59.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">g 在某個 FEC 群組裡</text>
<line x1="350" y1="76" x2="350" y2="108" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<rect x="200" y="110" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="350.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">找群組代表 r</text><text x="350.0" y="149.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">群組中最早走到的閘</text>
<line x1="350" y1="166" x2="350" y2="198" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<rect x="200" y="200" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="350.0" y="219.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">g 與 r 的 fanin 相同？</text><text x="350.0" y="239.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">兩條邊完全一樣</text>
<line x1="350" y1="256" x2="350" y2="288" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="358" y="276" font-size="12" fill="#444441">否</text>
<rect x="200" y="290" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="350.0" y="309.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">SAT：g ⊕ (r ^ 相位) 可為 1？</text><text x="350.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">只建兩者的 fanin 錐</text>
<path d="M200 228 L40 228 L40 428 L58 428" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="48" y="220" font-size="12" fill="#444441">是</text>
<path d="M280 346 L280 372 L190 372 L190 398" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="198" y="388" font-size="12" fill="#444441">UNSAT（等價）</text>
<path d="M420 346 L420 372 L510 372 L510 398" stroke="#5F5E5A" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="518" y="388" font-size="12" fill="#444441">SAT（不等價）</text>
<rect x="60" y="400" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="190.0" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">合併 g 到 r</text><text x="190.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">把 g ≡ r 加進求解器</text>
<rect x="380" y="400" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="510.0" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">存下反例</text><text x="510.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">滿 64 個就模擬、切分群組</text>
<text x="350" y="490" text-anchor="middle" font-size="12" fill="#444441">兩種結果都接著處理下一個閘；群組清空後結束</text>
</svg>