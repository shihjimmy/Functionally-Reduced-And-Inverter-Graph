<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>fraig 各套件的相依關係</title><desc>main 需要 cmd 與 cir；cir 需要 cmd、sat、util；cmd 需要 util；沒有任何箭頭從 cmd 指向 cir。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="350" rx="12" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
<g font-family="'Noto Sans CJK TC','Microsoft JhengHei','PingFang TC','Segoe UI',Arial,sans-serif">
<rect x="250" y="30" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="340.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">main</text>
<text x="340.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">迴圈：讀指令、執行</text>
<rect x="80" y="140" width="180" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="170.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">cmd</text>
<text x="170.0" y="173.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">命令列框架，不認識 cir</text>
<rect x="420" y="140" width="180" height="48" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="510.0" y="155.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">cir</text>
<text x="510.0" y="173.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">電路與電路指令</text>
<rect x="80" y="250" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="170.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">util</text>
<text x="170.0" y="283.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">雜湊、字串、亂數</text>
<rect x="420" y="250" width="180" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="510.0" y="265.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">sat</text>
<text x="510.0" y="283.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">MiniSat 求解器</text>
<line x1="300" y1="80" x2="200" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="380" y1="80" x2="480" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="418" y1="164" x2="262" y2="164" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="170" y1="190" x2="170" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="510" y1="190" x2="510" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="450" y1="190" x2="262" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">箭頭 = 「需要」。沒有任何箭頭從 cmd 指向 cir。</text>
</g>
</svg>
