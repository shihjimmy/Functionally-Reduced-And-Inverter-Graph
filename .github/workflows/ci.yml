name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # g++ and clang++, warnings (-Wall -Wextra) are errors; all ctest tests
  # (golden outputs, random circuits checked by CIRVerify, GoogleTest unit tests).
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DFRAIG_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2

  # Same tests under AddressSanitizer + UndefinedBehaviorSanitizer:
  # out-of-bounds, use-after-free, memory leaks, undefined behavior.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DFRAIG_SANITIZE=ON -DFRAIG_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2
